<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WordPress API Fetcher</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-lg">
    <h1 class="text-2xl font-bold mb-4 text-center text-blue-600">WordPress API Fetcher</h1>

    <!-- Formulario -->
    <div class="mb-4">
      <label class="block text-gray-700 mb-2" for="siteUrl">URL del Dominio de WordPress</label>
      <input
        id="siteUrl"
        type="text"
        placeholder="https://tusitio.com"
        class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
      />
    </div>

    <div class="mb-4">
      <label class="block text-gray-700 mb-2" for="endpoint">Tipo de Datos a Obtener</label>
      <select
        id="endpoint"
        class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
      >
        <option value="posts">Posts</option>
        <option value="pages">Pages</option>
        <option value="categories">Categories</option>
        <option value="tags">Tags</option>
        <option value="users">Users</option>
        <option value="media">Media</option>
        <option value="comments">Comments</option>
      </select>
    </div>

    <button
      id="getDataBtn"
      class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition"
    >
      Get URLs
    </button>

    <!-- Resultado -->
    <div id="results" class="mt-6">
      <!-- URLs se cargan aquí -->
    </div>
  </div>

  <script>
    const getDataBtn = document.getElementById('getDataBtn');
    const siteUrlInput = document.getElementById('siteUrl');
    const endpointSelect = document.getElementById('endpoint');
    const resultsDiv = document.getElementById('results');

    getDataBtn.addEventListener('click', () => {
      const baseUrl = siteUrlInput.value.trim();
      const endpoint = endpointSelect.value;

      if (!baseUrl) {
        alert('Por favor ingresa la URL del dominio.');
        return;
      }

      const apiUrl = `${baseUrl.replace(/\/$/, '')}/wp-json/wp/v2/${endpoint}?per_page=100`;

      // Limpiar resultados anteriores
      resultsDiv.innerHTML = `
        <div class="text-gray-600 mb-2">Consultando <span class="font-bold">${endpoint}</span> desde <span class="text-blue-500">${baseUrl}</span>...</div>
      `;

      fetch(apiUrl)
        .then(response => {
          if (!response.ok) {
            throw new Error(`Error ${response.status}: ${response.statusText}`);
          }
          return response.json();
        })
        .then(data => {
          if (!data.length) {
            resultsDiv.innerHTML += `<p class="text-red-500 mt-4">No se encontraron resultados.</p>`;
            return;
          }

          const list = document.createElement('ul');
          list.classList.add('mt-4', 'space-y-2');

          data.forEach(item => {
            const link = item.link || item.slug || item.name || 'Sin enlace';
            const displayLink = item.link || `${baseUrl}/${endpoint}/${item.slug || item.id}`;

            const li = document.createElement('li');
            li.innerHTML = `
              <a href="${displayLink}" target="_blank" class="text-blue-600 hover:underline break-words">
                ${displayLink}
              </a>
            `;
            list.appendChild(li);
          });

          resultsDiv.appendChild(list);
        })
        .catch(error => {
          console.error('Error:', error);
          resultsDiv.innerHTML += `<p class="text-red-500 mt-4">Error al obtener datos: ${error.message}</p>`;
        });
    });
  </script>

</body>
</html>
